project_type: python
pipeline_uuid: iris_classifier

blocks:
  - uuid: load_iris
    type: data_loader
    language: python
    file_path: iris_project/data_loaders/load_iris.py
    downstream_blocks:
      - check_no_missing

  - uuid: check_no_missing
    type: transformer
    language: python
    file_path: iris_project/transformers/check_no_missing.py
    upstream_blocks:
      - load_iris
    downstream_blocks:
      - prepare_data

  - uuid: prepare_data
    type: transformer
    language: python
    file_path: iris_project/transformers/prepare_data.py
    upstream_blocks:
      - check_no_missing
    downstream_blocks:
      - train_model

  - uuid: train_model
    type: transformer
    language: python
    file_path: iris_project/transformers/train_model.py
    upstream_blocks:
      - prepare_data
    downstream_blocks:
      - save_results
      - evaluate_model

  - uuid: save_results
    type: data_exporter
    language: python
    file_path: iris_project/data_exporters/save_results.py
    upstream_blocks:
      - train_model

  - uuid: evaluate_model
    type: transformer
    language: python
    file_path: iris_project/transformers/evaluate_model.py
    upstream_blocks:
      - train_model
